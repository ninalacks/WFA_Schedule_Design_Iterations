<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WFA Date Filter – Iteration 6</title>
<style>
  :root {
    --navy: #0f1f3d;
    --range: #dbe8fe;
    --border: #cfd4da;
    --text: #1c2430;
    --muted: #5b6573;
    --focus: #2563eb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px; background: #eef0f3;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
  }
  :root { --blue: #1f4e9c; }
  .panel {
    width: 340px; min-height: 640px; background: #fff; border-radius: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,.12); position: relative; overflow: visible;
    transition: width .25s ease;
  }
  .panel.collapsed { width: 56px; }
  .panel.collapsed, .panel.animating { overflow: hidden; }
  .panel-body { width: 340px; min-height: 640px; padding: 20px 18px; position: relative; transition: opacity .15s ease; }
  .panel.collapsed .panel-body { opacity: 0; pointer-events: none; }
  .panel-head { display: flex; align-items: center; justify-content: space-between; margin: 0 0 20px; }
  h1 { font-size: 28px; margin: 0; }
  .icon-btn { width: 40px; height: 40px; border: 0; background: transparent; border-radius: 8px; color: var(--blue); cursor: pointer; display: grid; place-items: center; }
  .icon-btn:hover { background: #eef2fa; }
  .icon-btn:focus-visible { outline: 2px solid var(--focus); }
  .rail { position: absolute; top: 0; left: 0; width: 56px; padding-top: 14px; display: flex; justify-content: center; opacity: 0; pointer-events: none; transition: opacity .15s ease .1s; }
  .panel.collapsed .rail { opacity: 1; pointer-events: auto; }
  @media (prefers-reduced-motion: reduce) { .panel, .panel-body, .rail { transition: none; } }
  label { display: block; font-weight: 600; font-size: 14px; color: var(--muted); margin: 18px 0 6px; }
  .field {
    width: 100%; height: 40px; border: 1px solid var(--border); border-radius: 6px;
    background: #fff; display: flex; align-items: center; padding: 0 10px; gap: 8px;
    font-size: 15px; color: var(--text); cursor: pointer; text-align: left;
  }
  .field.placeholder { color: #666; }
  .field[aria-expanded="true"], .field:focus-visible { border: 2px solid var(--focus); outline: none; padding: 0 9px; }
  .field .label { flex: 1; }
  .clear-x { border: 0; background: none; font-size: 18px; color: var(--muted); cursor: pointer; padding: 0 4px; }
  .caret { font-size: 10px; color: var(--muted); }

  .sel { position: relative; }
  .sel select.field { padding-right: 62px; }
  .sel select.field.empty { color: #666; }
  .sel .caret { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); pointer-events: none; }
  .sel .clear-x { position: absolute; right: 30px; top: 50%; transform: translateY(-50%); }
  .clear-x:hover { color: var(--text); }
  .clear-x:focus-visible { outline: 2px solid var(--focus); border-radius: 4px; }
  .dropdown { position: relative; }
  .popover {
    position: absolute; top: 44px; left: 0; width: 300px; background: #fff;
    border: 1px solid var(--border); border-radius: 6px; padding: 12px 10px;
    box-shadow: 0 6px 20px rgba(0,0,0,.18); z-index: 10;
  }
  .popover[hidden] { display: none; }
  .head, .row { display: grid; grid-template-columns: 52px repeat(4, 1fr); align-items: center; }
  .head { color: var(--muted); font-size: 14px; margin-bottom: 6px; padding-left: 4px; }
  .head span:first-child { grid-column: 1; }
  .head span:nth-child(2) { grid-column: 2; }
  .scroll { max-height: 280px; overflow-y: auto; }
  .row { height: 44px; position: relative; }
  .plabel {
    width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center;
    font-size: 15px; margin-left: 4px; border-right: 0;
  }
  .plabel.clickable { cursor: pointer; }
  .plabel.clickable:not(.edge):hover { background: var(--range); }
  .plabel:focus-visible { outline: 2px solid var(--focus); }
  .plabel.edge { background: var(--navy); color: #fff; }
  .week {
    height: 36px; border: 0; background: transparent; font-size: 15px; color: var(--text);
    cursor: pointer; display: grid; place-items: center; margin: 4px 0; position: relative;
  }
  .week.inrange, .week.preview { background: var(--range); }
  .week.edge::before {
    content: ""; position: absolute; width: 36px; height: 36px; border-radius: 50%;
    background: var(--navy); z-index: 0;
  }
  .week.edge span { position: relative; z-index: 1; color: #fff; }
  .week:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
  .divider { border-left: 1px solid #e3e6ea; position: absolute; left: 52px; top: 4px; bottom: 4px; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; background: #eceef1; border-radius: 999px; padding: 3px; margin: 0 4px 12px; }
  .seg button { border: 0; background: transparent; height: 30px; border-radius: 999px; font-size: 14px; color: var(--muted); cursor: pointer; }
  .seg button[aria-pressed="true"] { background: #fff; color: var(--text); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
  .seg button:focus-visible { outline: 2px solid var(--focus); }
  .field .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hint { font-size: 13px; color: var(--muted); margin: 10px 4px 0; min-height: 18px; }

  .footer { position: absolute; left: 18px; right: 18px; bottom: 18px; }
  .footer .btn.primary { width: 100%; }
  .clear-row { display: flex; justify-content: flex-end; margin: -6px 0 0; }
  .link-btn { border: 0; background: none; padding: 4px 2px; font-size: 16px; color: var(--blue); text-decoration: underline; cursor: pointer; }
  .link-btn:focus-visible { outline: 2px solid var(--focus); border-radius: 2px; }
  .link-btn:disabled { color: #9aa3b0; cursor: default; }
  .btn { height: 44px; padding: 0 22px; border-radius: 6px; font-size: 17px; border: 1px solid var(--border); background: #fff; cursor: pointer; }
  .btn.primary { background: var(--navy); color: #fff; border-color: var(--navy); font-weight: 600; }
  .btn:disabled { color: #b6bcc4; cursor: default; }
</style>
</head>
<body>
<div class="panel" id="panel">
  <div class="panel-body" id="panelBody">
  <div class="panel-head">
    <h1>Filters</h1>
    <button class="icon-btn" id="collapseBtn" aria-label="Collapse filters" aria-controls="panelBody" aria-expanded="true">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
  </div>

  <div class="clear-row"><button class="link-btn" id="clearAll" disabled>Clear All</button></div>

  <label>Year</label>
  <div class="sel">
    <select class="field empty" id="year" style="appearance:none;-webkit-appearance:none;">
      <option value="">--- Select a Value ---</option>
    </select>
    <button class="clear-x" type="button" aria-label="Clear Year" hidden>✕</button>
    <span class="caret">▼</span>
  </div>

  <label>Date</label>
  <div class="dropdown" id="dd">
    <div class="field placeholder" id="trigger" role="button" tabindex="0" aria-haspopup="true" aria-expanded="false">
      <span class="label" id="triggerLabel">--- Select a Value ---</span>
      <button class="clear-x" id="clearX" aria-label="Clear date" hidden>✕</button>
      <span class="caret">▼</span>
    </div>
    <div class="popover" id="popover" hidden>
      <div class="seg" role="group" aria-label="Selection mode">
        <button type="button" id="modeRange" aria-pressed="true">Range</button>
        <button type="button" id="modeSingle" aria-pressed="false">Individual weeks</button>
      </div>
      <div class="head"><span>Period:</span><span style="grid-column:2 / span 4">Week:</span></div>
      <div class="scroll" id="grid"></div>
      <div class="hint" id="hint" aria-live="polite"></div>
    </div>
  </div>

  <label>Process Manager</label>
  <div class="sel">
    <select class="field empty" style="appearance:none;-webkit-appearance:none;">
      <option value="">--- Select a Value ---</option><option>Alex Rivera</option><option>Jordan Lee</option><option>Sam Patel</option>
    </select>
    <button class="clear-x" type="button" aria-label="Clear Process Manager" hidden>✕</button>
    <span class="caret">▼</span>
  </div>
  <label>Division</label>
  <div class="sel">
    <select class="field empty" style="appearance:none;-webkit-appearance:none;">
      <option value="">--- Select a Value ---</option><option>Atlanta</option><option>Cincinnati</option><option>Dallas</option><option>Louisville</option>
    </select>
    <button class="clear-x" type="button" aria-label="Clear Division" hidden>✕</button>
    <span class="caret">▼</span>
  </div>
  <label>Status</label>
  <div class="sel">
    <select class="field empty" style="appearance:none;-webkit-appearance:none;">
      <option value="">--- Select a Value ---</option><option>Draft</option><option>Scheduled</option><option>Complete</option>
    </select>
    <button class="clear-x" type="button" aria-label="Clear Status" hidden>✕</button>
    <span class="caret">▼</span>
  </div>

  <div class="footer">
    <button class="btn primary">Apply</button>
  </div>
  </div>
  <div class="rail">
    <button class="icon-btn" id="expandBtn" aria-label="Open filters" aria-controls="panelBody" aria-expanded="false" tabindex="-1">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" aria-hidden="true"><path d="M3 6h9M18 6h3M3 12h3M12 12h9M3 18h11M20 18h1"/><circle cx="15" cy="6" r="2.2"/><circle cx="9" cy="12" r="2.2"/><circle cx="17" cy="18" r="2.2"/></svg>
    </button>
  </div>
</div>

<script>
(() => {
  const PERIODS = 13, WEEKS = 4;
  // A week's position in the calendar: 0..51
  const idx = (p, w) => (p - 1) * WEEKS + (w - 1);
  const name = i => `P${Math.floor(i / WEEKS) + 1}W${(i % WEEKS) + 1}`;

  const DEFAULT_YEAR = new Date().getFullYear();   // auto-fill uses the current year
  // committed = what the filter actually holds; start/end/hover = draft while the dropdown is open
  let committed = { start: null, end: null };
  let start = null, end = null, hover = null;
  let mode = 'range';              // 'range' | 'single'
  const singles = new Set();       // committed selection in single mode
  let year = '';

  const $ = id => document.getElementById(id);
  const trigger = $('trigger'), popover = $('popover'), grid = $('grid'),
        hint = $('hint'), yearSel = $('year'), clearX = $('clearX'), clearAll = $('clearAll');

  const sels = [...document.querySelectorAll('.sel')].map(w => ({ sel: w.querySelector('select'), x: w.querySelector('.clear-x') }));
  const syncSel = ({ sel, x }) => { x.hidden = !sel.value; sel.classList.toggle('empty', !sel.value); };

  // Year options: previous, current, next
  [DEFAULT_YEAR - 1, DEFAULT_YEAR, DEFAULT_YEAR + 1].forEach(y => yearSel.add(new Option(y, y)));

  // Build grid
  for (let p = 1; p <= PERIODS; p++) {
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `<div class="plabel" data-p="${p}">${p}</div><div class="divider"></div>`;
    for (let w = 1; w <= WEEKS; w++) {
      const b = document.createElement('button');
      b.className = 'week';
      b.type = 'button';
      b.dataset.i = idx(p, w);
      b.innerHTML = `<span>${w}</span>`;
      b.setAttribute('aria-label', `Period ${p} week ${w}`);
      row.appendChild(b);
    }
    grid.appendChild(row);
  }
  const weekEls = [...grid.querySelectorAll('.week')];
  const plabels = [...grid.querySelectorAll('.plabel')];

  function bounds() {
    // While choosing the end, the range follows the hovered week (Airbnb-style)
    if (mode !== 'range' || start === null) return null;
    const other = end !== null ? end : (hover !== null ? hover : start);
    return [Math.min(start, other), Math.max(start, other)];
  }

  function render() {
    const b = bounds();
    const picking = start !== null && end === null;
    weekEls.forEach(el => {
      const i = +el.dataset.i;
      el.setAttribute('aria-pressed', mode === 'single' ? singles.has(i) : 'false');
      if (mode === 'single') {
        el.classList.toggle('edge', singles.has(i));
        el.classList.remove('inrange', 'preview');
        return;
      }
      const edge = b && (i === b[0] || i === b[1]);
      const inside = b && i > b[0] && i < b[1];
      el.classList.toggle('edge', !!edge);
      el.classList.toggle('inrange', !!inside && !picking);
      el.classList.toggle('preview', !!inside && picking);
    });
    plabels.forEach(el => {
      const p = +el.dataset.p;
      const on = mode === 'single'
        ? [...singles].some(i => Math.floor(i / WEEKS) + 1 === p)
        : !!b && (Math.floor(b[0] / WEEKS) + 1 === p || Math.floor(b[1] / WEEKS) + 1 === p);
      el.classList.toggle('edge', on);
      el.classList.toggle('clickable', mode === 'range');
      if (mode === 'range') { el.setAttribute('role', 'button'); el.tabIndex = 0; el.setAttribute('aria-label', `Select all of period ${p}`); }
      else { el.removeAttribute('role'); el.removeAttribute('tabindex'); el.removeAttribute('aria-label'); }
    });

    $('modeRange').setAttribute('aria-pressed', mode === 'range');
    $('modeSingle').setAttribute('aria-pressed', mode === 'single');
    hint.textContent = mode === 'single'
      ? (singles.size ? `${singles.size} selected. Click a selected week to remove it.` : 'Click weeks to select them individually.')
      : start === null ? 'Click a week to start your range.'
      : end === null ? 'Now click an end week.' : '';

    const c = committed, y = year || DEFAULT_YEAR;
    const has = hasValue();
    const label = !has ? '--- Select a Value ---'
      : mode === 'single' ? `${y}: ${[...singles].sort((a, b) => a - b).map(name).join(', ')}`
      : `${y}: ${name(Math.min(c.start, c.end))}-${name(Math.max(c.start, c.end))}`;
    $('triggerLabel').textContent = label;
    trigger.title = has ? label : '';
    trigger.classList.toggle('placeholder', !has);
    clearX.hidden = !has;
    sels.forEach(syncSel);
    clearAll.disabled = !has && !sels.some(o => o.sel.value);
  }

  const hasValue = () => mode === 'single' ? singles.size > 0 : committed.start !== null;
  const clearSelection = () => { committed = { start: null, end: null }; singles.clear(); syncDraft(); };
  function pick(i) {
    if (mode === 'single') {
      singles.has(i) ? singles.delete(i) : singles.add(i);
      if (singles.size && !year) { year = String(DEFAULT_YEAR); yearSel.value = year; }
      render();
      return;
    }
    if (start === null || end !== null) { start = i; end = null; hover = null; }  // begin new range
    else {                                                                         // finish range; stay open
      end = i;
      committed = { start, end };
      if (!year) { year = String(DEFAULT_YEAR); yearSel.value = year; }          // Date fills in Year
    }
    render();
  }
  function syncDraft() { start = committed.start; end = committed.end; hover = null; }
  function reset() { clearSelection(); year = ''; sels.forEach(o => { o.sel.value = ''; }); render(); }

  function pickPeriod(p) {
    if (mode !== 'range') return;                 // single mode: period numbers do nothing
    start = idx(p, 1); end = idx(p, WEEKS); hover = null;
    committed = { start, end };
    if (!year) { year = String(DEFAULT_YEAR); yearSel.value = year; }
    render();
  }
  grid.addEventListener('click', e => {
    const pl = e.target.closest('.plabel');
    if (pl) return pickPeriod(+pl.dataset.p); const b = e.target.closest('.week'); if (b) pick(+b.dataset.i); });
  grid.addEventListener('mouseover', e => {
    const b = e.target.closest('.week');
    if (mode === 'range' && b && start !== null && end === null) { hover = +b.dataset.i; render(); }
  });
  grid.addEventListener('mouseleave', () => { if (end === null && hover !== null) { hover = null; render(); } });
  grid.addEventListener('keydown', e => {
    const pl = e.target.closest('.plabel');
    if (pl && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); pickPeriod(+pl.dataset.p); }
  });
  // Keyboard: focus on a week also previews
  grid.addEventListener('focusin', e => {
    const b = e.target.closest('.week');
    if (mode === 'range' && b && start !== null && end === null) { hover = +b.dataset.i; render(); }
  });

  // Open / close — only outside click (or Esc) closes it
  const setOpen = open => {
    if (!open && !popover.hidden) syncDraft();   // closing discards an unfinished range
    if (open) syncDraft();
    popover.hidden = !open; trigger.setAttribute('aria-expanded', open);
    render();
  };
  trigger.addEventListener('click', e => {
    if (e.target === clearX) return;
    if (popover.hidden) setOpen(true);   // clicking the field again does not toggle it shut
  });
  trigger.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setOpen(true); } });
  document.addEventListener('mousedown', e => { if (!$('dd').contains(e.target)) setOpen(false); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') setOpen(false); });

  clearX.addEventListener('click', e => { e.stopPropagation(); clearSelection(); render(); });
  yearSel.addEventListener('change', () => {
    year = yearSel.value;
    if (!year) clearSelection();   // clearing Year clears Date
    render();
  });
  function setMode(m) {
    if (m === mode) return;
    mode = m;
    clearSelection();   // the two modes mean different things, so switching starts fresh (Year is kept)
    render();
  }
  $('modeRange').addEventListener('click', () => setMode('range'));
  $('modeSingle').addEventListener('click', () => setMode('single'));
  // ✕ inside each select: shown only when it has a value
  sels.forEach(o => {
    o.sel.addEventListener('change', () => { syncSel(o); render(); });
    o.x.addEventListener('click', () => {
      o.sel.value = '';
      o.sel.dispatchEvent(new Event('change'));   // Year's own handler also clears Date
      o.sel.focus();
    });
  });
  clearAll.addEventListener('click', () => { reset(); setOpen(false); });

  // Panel open / close — the filters and their selections are kept while collapsed
  const panel = $('panel'), body = $('panelBody'), collapseBtn = $('collapseBtn'), expandBtn = $('expandBtn');
  function setPanel(open) {
    if (!open) setOpen(false);                    // collapsing closes the date dropdown (an unfinished range is discarded)
    panel.classList.add('animating');
    setTimeout(() => panel.classList.remove('animating'), 300);
    panel.classList.toggle('collapsed', !open);
    body.inert = !open;                           // hidden controls leave the tab order
    expandBtn.tabIndex = open ? -1 : 0;
    collapseBtn.setAttribute('aria-expanded', open);
    expandBtn.setAttribute('aria-expanded', open);
    (open ? collapseBtn : expandBtn).focus();
  }
  collapseBtn.addEventListener('click', () => setPanel(false));
  expandBtn.addEventListener('click', () => setPanel(true));

  render();
})();
</script>
</body>
</html>
