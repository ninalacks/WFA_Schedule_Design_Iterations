<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Removed Resets</title>
<style>
  :root {
    --navy: #0f1f3d; --blue: #1f4e9c; --text: #1c2430; --muted: #5b6573; --border: #d5d9df; --focus: #2563eb; --bg: #f3f4f6;
    --warn-bg: #fdf3c8; --warn-text: #5c4300;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  button { font: inherit; color: inherit; }
  button:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  .topbar { background: var(--navy); height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; }
  .brand { color: #fff; font-weight: 700; font-size: 18px; border: 1px solid #fff8; border-radius: 4px; padding: 8px 14px; }
  .topbar a { color: #8fb4ff; font-weight: 700; font-size: 18px; text-decoration: underline; text-underline-offset: 6px; }

  .app { position: relative; padding: 18px 24px 40px; max-width: 1500px; margin: 0 auto; }

  /* Prototype controls (not part of the design) */
  .proto { border: 1px dashed #9aa3b0; border-radius: 6px; background: #fff; padding: 10px 14px; display: grid; gap: 8px; font-size: 14px; margin-bottom: 16px; }
  .prow { display: flex; flex-wrap: wrap; gap: 6px 22px; align-items: center; }
  .pgroup { display: inline-flex; align-items: center; gap: 8px; }
  .plabel { font-weight: 600; font-size: 13px; }
  .seg { display: inline-flex; gap: 6px; }
  .seg button { border: 1px solid var(--border); background: #fff; border-radius: 4px; padding: 4px 10px; cursor: pointer; font-size: 13px; }
  .seg button[aria-pressed="true"] { background: var(--navy); color: #fff; border-color: var(--navy); }
  .ptag { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .about { background: #fff; border-radius: 6px; padding: 10px 14px; font-size: 14px; line-height: 1.5; color: var(--muted); margin-bottom: 16px; }
  .about b { color: var(--text); }
  .linkbtn { border: 0; background: none; color: var(--blue); text-decoration: underline; cursor: pointer; padding: 2px; font-size: 13px; }

  main.gray { filter: grayscale(1); }

  .titlerow { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; }
  h1 { font-size: 30px; margin: 0; }
  .meta { text-align: right; font-size: 15px; color: #333; line-height: 1.35; }
  .tools { display: flex; gap: 8px; justify-content: flex-end; margin-bottom: 8px; }
  .sq { width: 40px; height: 40px; border: 1px solid var(--border); background: #fff; border-radius: 4px; display: grid; place-items: center; cursor: pointer; }

  .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin: 14px 0; }
  .tbtns { display: flex; gap: 10px; flex-wrap: wrap; }
  .tb { height: 38px; padding: 0 14px; border: 1px solid var(--border); background: #fff; border-radius: 4px; font-size: 16px; cursor: pointer; }
  .tb.pub { background: #707c8d; border-color: #707c8d; color: #fff; }
  .tb.pub[aria-disabled="true"] { opacity: .6; cursor: default; }
  .viewsw { display: flex; align-items: center; gap: 8px; font-size: 16px; color: var(--muted); }
  .viewsw .on { color: var(--text); font-weight: 700; }
  .switch { width: 38px; height: 22px; border-radius: 999px; background: #d1d5db; border: 0; position: relative; cursor: pointer; padding: 0; }
  .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: left .15s; }
  .switch[aria-checked="true"] { background: var(--navy); }
  .switch[aria-checked="true"]::after { left: 18px; }

  .banner { background: var(--warn-bg); color: var(--warn-text); border-radius: 4px; padding: 12px 16px; font-size: 16px; margin-bottom: 14px; }
  .banner .bd { color: #7a5b00; margin-left: 6px; }

  .gridbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; min-height: 40px; margin-bottom: 8px; font-size: 15px; color: var(--muted); }
  .gridbar.notice { background: #eaf1fb; color: #163a73; border-radius: 4px; padding: 8px 14px; justify-content: flex-start; gap: 10px; }
  .gridbar .link { border: 0; background: none; color: var(--blue); text-decoration: underline; font-weight: 600; cursor: pointer; padding: 2px 4px; font-size: 15px; }
  .chk { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; color: var(--text); font-size: 15px; }
  .chk input { width: 18px; height: 18px; accent-color: var(--navy); }
  .tag { display: inline-flex; align-items: center; gap: 8px; background: #fff; border: 1px solid var(--border); border-radius: 999px; padding: 3px 4px 3px 12px; font-size: 14px; color: var(--text); }
  .tag button { border: 0; background: #eceef1; border-radius: 50%; width: 22px; height: 22px; cursor: pointer; font-size: 12px; }

  .tablewrap { background: #fff; border: 1px solid #e3e6ea; overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; min-width: 1400px; font-size: 15px; }
  th { background: #f1f2f4; text-align: left; font-weight: 700; padding: 12px 10px; border-bottom: 2px solid #dde0e5; font-size: 15px; white-space: nowrap; }
  td { padding: 14px 10px; border-bottom: 1px solid #eceef1; vertical-align: middle; }
  td.act, th.actc { width: 62px; text-align: center; padding-left: 4px; padding-right: 4px; }
  td.com { max-width: 330px; }
  tr.add td { background: #e9f6ec; }
  tr.rm td { background: #e8eaee; color: #6b7280; }
  tr.rm td.d { text-decoration: line-through; text-decoration-thickness: 1px; }
  tr.grp th { background: #f8f9fb; text-align: left; font-size: 12px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); padding: 10px; border-top: 2px solid #dde0e5; }
  .emp { text-align: center; color: var(--muted); padding: 32px; }

  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 12px; border-radius: 999px; font-size: 14px; font-weight: 600; white-space: nowrap; }
  .pill.added { background: #d7efdd; color: #17653a; }
  .pill.mod { background: #e1eafb; color: #1f4e9c; }
  .pill.rem { background: #151a22; color: #fff; }
  .hist { display: block; margin-top: 4px; border: 0; background: none; color: var(--blue); text-decoration: underline; cursor: pointer; font-size: 13px; padding: 0; }
  .ib { width: 36px; height: 36px; border: 1px solid var(--border); background: #fff; border-radius: 4px; cursor: pointer; display: inline-grid; place-items: center; color: #1c2430; }
  .ib[aria-disabled="true"] { color: #c3c8d0; cursor: not-allowed; background: #f4f5f7; }

  /* Filter panel (reveal option 3) */
  .rail { position: absolute; left: 0; top: 380px; width: 38px; height: 54px; border: 1px solid var(--border); border-left: 0; background: #fff; border-radius: 0 8px 8px 0; cursor: pointer; display: grid; place-items: center; color: var(--blue); z-index: 20; }
  .panel { position: absolute; left: 0; top: 150px; width: 310px; background: #fff; border: 1px solid var(--border); border-radius: 0 12px 12px 0; box-shadow: 0 8px 30px rgba(0,0,0,.2); z-index: 30; }
  .ph { display: flex; justify-content: space-between; align-items: center; padding: 16px 18px; border-bottom: 1px solid #e3e6ea; }
  .ph h2 { margin: 0; font-size: 22px; }
  .ph button { border: 0; background: none; font-size: 20px; cursor: pointer; color: var(--muted); width: 36px; height: 36px; border-radius: 6px; }
  .pb { padding: 16px 18px; }
  .pb .lbl { font-weight: 600; font-size: 14px; color: var(--muted); margin: 0 0 8px; }
  .help { font-size: 13px; color: var(--muted); margin: 8px 0 0; line-height: 1.45; }
  .pf { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px 18px; border-top: 1px solid #e3e6ea; }
  .pf .link { border: 0; background: none; color: var(--blue); text-decoration: underline; font-size: 16px; cursor: pointer; }
  .apply { height: 42px; padding: 0 28px; background: var(--navy); color: #fff; border: 0; border-radius: 6px; font-size: 16px; font-weight: 600; cursor: pointer; }

  /* History dialog */
  .scrim { position: fixed; inset: 0; background: rgba(15,23,42,.45); z-index: 50; display: grid; place-items: center; padding: 16px; }
  .dlg { background: #fff; border-radius: 12px; width: min(560px, 100%); box-shadow: 0 12px 40px rgba(0,0,0,.3); }
  .dlg header { display: flex; justify-content: space-between; align-items: center; padding: 18px 22px; border-bottom: 1px solid #e3e6ea; }
  .dlg h2 { margin: 0; font-size: 20px; }
  .dlg header button { border: 0; background: none; font-size: 20px; width: 36px; height: 36px; cursor: pointer; border-radius: 6px; color: var(--muted); }
  .dlg ol { list-style: none; margin: 0; padding: 8px 22px 20px; }
  .dlg li { padding: 12px 0; border-bottom: 1px solid #eceef1; }
  .dlg li:last-child { border-bottom: 0; }
  .ev { font-weight: 700; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .evm { font-size: 14px; color: var(--muted); margin-top: 2px; }
  .evn { font-size: 14px; margin-top: 4px; }
  .note { font-size: 12px; color: var(--muted); padding: 0 22px 16px; }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #1c2430; color: #fff; padding: 10px 18px; border-radius: 8px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 80; max-width: 90vw; }
  .toast.show { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { .toast, .switch::after { transition: none; } }
</style>
</head>
<body>
<div class="topbar"><span class="brand">Kroger | Reset Planner</span><a href="#" onclick="return false">Resets</a></div>

<div class="app">
  <div class="proto" id="proto"></div>
  <div class="about" id="about"></div>

  <button class="rail" id="rail" aria-label="Open filters" hidden>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" aria-hidden="true"><path d="M3 6h9M18 6h3M3 12h3M12 12h9M3 18h11M20 18h1"/><circle cx="15" cy="6" r="2.2"/><circle cx="9" cy="12" r="2.2"/><circle cx="17" cy="18" r="2.2"/></svg>
  </button>
  <aside class="panel" id="panel" role="dialog" aria-labelledby="panelTitle" hidden>
    <div class="ph"><h2 id="panelTitle">Filters</h2><button id="panelClose" aria-label="Close filters">✕</button></div>
    <div class="pb">
      <p class="lbl">Removed resets</p>
      <label class="chk"><input type="checkbox" id="panelChk"> Include removed resets</label>
      <p class="help" id="panelHelp"></p>
    </div>
    <div class="pf"><button class="link" id="panelClear">Clear All</button><button class="apply" id="panelApply">Apply</button></div>
  </aside>

  <main id="main">
    <div class="titlerow">
      <h1>KOMPASS Schedule</h1>
      <div>
        <div class="tools">
          <button class="sq" aria-label="Download" data-stub>⬇</button><button class="sq" aria-label="Notifications" data-stub>🔔</button><button class="sq" aria-label="Refresh" data-stub>↺</button>
        </div>
        <div class="meta" id="meta"></div>
      </div>
    </div>

    <div class="toolbar" id="toolbar">
      <div class="tbtns">
        <button class="tb" data-stub>New Entry</button>
        <button class="tb" data-stub>Create New Draft</button>
        <button class="tb pub" id="publishBtn">Publish Change</button>
        <button class="tb pub" data-stub>Ready to Publish →</button>
      </div>
      <div class="viewsw">
        <span id="lblDraft">✎ Draft View</span>
        <button class="switch" id="viewSwitch" role="switch" aria-checked="false" aria-label="Show published view"></button>
        <span id="lblPub">✔ Published View</span>
      </div>
    </div>

    <div class="banner" id="banner" role="status"></div>
    <div class="gridbar" id="gridbar" aria-live="polite"></div>

    <div class="tablewrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
  </main>
</div>

<div class="scrim" id="scrim" hidden>
  <div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
    <header><h2 id="dlgTitle">History</h2><button id="dlgClose" aria-label="Close history">✕</button></header>
    <ol id="dlgBody"></ol>
    <p class="note">History is the record of what changed. The Published Calendar only shows what is currently scheduled.</p>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const toast = m => { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2800); };
  const nowStr = () => { const d = new Date(); return d.toLocaleDateString('en-US') + ' ' + d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }); };

  const ICON = {
    edit: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l4-1 11-11-3-3L5 16l-1 4z"/></svg>',
    trash: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg>',
    restore: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 3-6.2M4 4v5h5"/></svg>',
    minus: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12h8"/></svg>',
    info: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>',
  };

  /* ---------- Demo data (invented, shaped like your screenshots) ----------
     pending = unpublished change in the draft; pub = flag from the last published version;
     live = exists in the published schedule; inDraft = shown in the draft */
  const R = (o) => Object.assign({ pending: null, pub: null, live: true, inDraft: true, modBy: '', events: [] }, o);
  const seed = () => [
    R({ id: 1, type: 'Update', dept: '01 - Grocery', comm: '017 - Flour & Meal', cm: 'Monica White', pm: 'Kelly Jacob', size: 12, start: 'P1 W1', dur: 4, hours: 4, divs: 'All', comments: 'Reset postponed due to inventory delays at the regional distribution center', pending: 'Added', live: false, modBy: 'John Doe' }),
    R({ id: 2, type: 'NII', dept: '17 - Natural Foods', comm: '677 - NF Baking Mixes', cm: 'Sarah Johnson', pm: 'Michael Lee', size: 10, start: 'P9 W4', dur: 1, hours: 2, divs: 12, comments: 'New layout implemented for improved flow. ALIGN WITH 062 - Yogurt', pending: 'Modified', modBy: 'Jane Doe' }),
    R({ id: 3, type: 'NII', dept: '02 - Dairy', comm: '062 - Yogurt', cm: 'William Turner', pm: 'Zoe Henderson', size: 12, start: 'P13 W4', dur: 4, hours: 3, divs: 'All', comments: 'ALIGN WITH 677 - NF Baking Mixes' }),
    R({ id: 4, type: 'NII', dept: '01 - Grocery', comm: '007 - Shelf Stable Milk', cm: 'Maria Carmen', pm: 'Teresa Mayfly', size: 12, start: 'P2 W2', dur: 4, hours: 5, divs: 'All', comments: 'ALIGN WITH 062 - Yogurt', pub: 'Added' }),
    R({ id: 5, type: 'Maintenance', dept: '02 - Dairy', comm: '062 - Yogurt', cm: 'Peter Grey', pm: 'Ian Smith', size: 16, start: 'P1 W3', dur: 4, hours: 6, divs: 'All', comments: 'Vendor confirmed new timeline. ALIGN WITH 007 - Shelf Stable Milk' }),
    R({ id: 6, type: 'NII', dept: '17 - Natural Foods', comm: '290 - NF Yogurt', cm: 'David Chen', pm: 'Emma Wilson', size: 24, start: 'P7 W3', dur: 1, hours: 1, divs: 'All', comments: 'Adjustments made to display fixtures', pending: 'Removed', modBy: 'John Doe',
      events: [{ t: 'Removed', pending: true, by: 'John Doe', when: '10/8/2026 2:14 PM', note: 'Vendor discontinued the item. Fixtures reused in P7.' }, { t: 'Added', by: 'Jane Doe', when: '1/7/2026 9:27 AM', note: '' }] }),
    R({ id: 7, type: 'Update', dept: '43 - Liquor', comm: '012 - Mixers', cm: 'Alexander Nguyen', pm: 'Isabella Garcia', size: 16, start: 'P1 W1', dur: 4, hours: 4, divs: 'All', comments: 'ALIGN WITH 003 - Can Beans' }),
    R({ id: 8, type: 'Update', dept: '01 - Grocery', comm: '003 - Can Beans', cm: 'Rachel Thompson', pm: 'Christopher Brown', size: 8, start: 'P11 W1', dur: 4, hours: 3, divs: 'All', comments: 'Approved by category manager. ALIGN WITH 012 - Mixers' }),
    R({ id: 9, type: 'Update', dept: '01 - Grocery', comm: '144 - Pasta Sauce', cm: 'Laura Kim', pm: 'Omar Reyes', size: 12, start: 'P4 W2', dur: 2, hours: 3, divs: 'All', comments: 'Discontinued by vendor', pub: 'Removed', live: false, inDraft: false,
      events: [{ t: 'Removed', version: '2026.02', by: 'Jane Doe', when: '9/22/2026 11:05 AM', note: 'Discontinued by vendor.' }, { t: 'Added', by: 'Jane Doe', when: '2/3/2026 10:40 AM', note: '' }] }),
    R({ id: 10, type: 'NII', dept: '01 - Grocery', comm: '221 - Granola', cm: 'Tom Alvarez', pm: 'Ana Petrova', size: 8, start: 'P8 W1', dur: 1, hours: 2, divs: 6, comments: 'Replaced by 227 - Cereal Bars', pub: 'Removed', live: false, inDraft: false,
      events: [{ t: 'Removed', version: '2026.02', by: 'John Doe', when: '9/22/2026 11:12 AM', note: 'Replaced by 227 - Cereal Bars.' }, { t: 'Added', by: 'John Doe', when: '3/11/2026 3:02 PM', note: '' }] }),
  ];

  /* ---------- State ---------- */
  let entries = seed(), version = 2, updated = '10/9/2026 3:28PM';
  let role = 'Creator', published = false;
  let treat = 'inplace';      // how removed rows are laid out: inplace | grouped
  let reveal = 'switch';      // how Published reveals removed: switch | notice | panel
  let viewerReveal = true, gray = false;
  let showRemoved = false, panelOpen = false, panelDraft = false;

  const asPublished = () => role === 'Viewer' || published;
  const canReveal = () => role === 'Creator' || viewerReveal;
  const revealed = () => asPublished() && canReveal() && showRemoved;
  const isRemoved = e => asPublished() ? e.pub === 'Removed' : e.pending === 'Removed';
  const statusOf = e => asPublished() ? e.pub : e.pending;
  const baseRows = () => asPublished() ? entries.filter(e => e.live || e.pub === 'Removed') : entries.filter(e => e.inDraft);
  const hiddenRemoved = () => asPublished() ? entries.filter(e => e.pub === 'Removed') : [];
  const shownRows = () => asPublished() && !revealed() ? baseRows().filter(e => e.pub !== 'Removed') : baseRows();
  const pendingList = () => entries.filter(e => e.pending);
  const resetReveal = () => { showRemoved = false; panelOpen = false; panelDraft = false; };

  /* ---------- Table ---------- */
  const cols = () => {
    const c = [];
    if (role === 'Creator' && !asPublished()) c.push(['edit', 'Edit'], ['remove', 'Remove'], ['mod', 'Modified By']);
    c.push(['status', 'Status'], ['type', 'Type'], ['dept', 'Department'], ['comm', 'Commodity'], ['cm', 'Category Manager'], ['pm', 'Process Manager'],
           ['size', 'Core Size'], ['start', 'Start'], ['dur', 'Duration'], ['hours', 'Hours'], ['divs', 'Nr of Divisions'], ['comments', 'Comments']);
    return c;
  };
  const pill = s => s === 'Added' ? '<span class="pill added">Added</span>' : s === 'Modified' ? '<span class="pill mod">Modified</span>'
    : s === 'Removed' ? `<span class="pill rem">${ICON.minus}Removed</span>` : '';
  const dur = n => `${n} ${n === 1 ? 'week' : 'weeks'}`;

  function cell(k, e, rm) {
    switch (k) {
      case 'edit': return `<td class="act"><button class="ib" data-edit="${e.id}" ${rm ? 'aria-disabled="true"' : ''} aria-label="Edit ${esc(e.comm)}">${ICON.edit}</button></td>`;
      case 'remove': return rm
        ? `<td class="act"><button class="ib" data-restore="${e.id}" aria-label="Restore ${esc(e.comm)}">${ICON.restore}</button></td>`
        : `<td class="act"><button class="ib" data-remove="${e.id}" aria-label="Remove ${esc(e.comm)}">${ICON.trash}</button></td>`;
      case 'mod': return `<td>${esc(e.modBy)}</td>`;
      case 'status': return `<td>${pill(statusOf(e))}${rm && role === 'Creator' ? `<button class="hist" data-hist="${e.id}">History</button>` : ''}</td>`;
      case 'comments': return `<td class="com">${esc(e.comments)}</td>`;
      case 'dur': return `<td class="d">${dur(e.dur)}</td>`;
      default: return `<td class="d">${esc(e[k])}</td>`;
    }
  }
  function renderTable() {
    const c = cols(), rows = shownRows();
    $('thead').innerHTML = '<tr>' + c.map(([k, l]) => `<th scope="col" class="${k === 'edit' || k === 'remove' ? 'actc' : ''}">${l}</th>`).join('') + '</tr>';
    const tr = e => { const rm = isRemoved(e), st = statusOf(e);
      return `<tr data-id="${e.id}" class="${rm ? 'rm' : st === 'Added' ? 'add' : ''}">${c.map(([k]) => cell(k, e, rm)).join('')}</tr>`; };
    let normal = rows, removed = [];
    if (treat === 'grouped') { normal = rows.filter(e => !isRemoved(e)); removed = rows.filter(isRemoved); }
    let body = normal.map(tr).join('');
    if (removed.length) body += `<tr class="grp"><th colspan="${c.length}" scope="colgroup">${asPublished()
      ? `Removed resets (${removed.length})` : `Pending removals (${removed.length}) · removed from the schedule when you publish`}</th></tr>` + removed.map(tr).join('');
    $('tbody').innerHTML = rows.length ? body : `<tr><td class="emp" colspan="${c.length}">No resets to show.</td></tr>`;
  }

  /* ---------- Chrome around the table ---------- */
  function renderMeta() {
    $('meta').innerHTML = asPublished()
      ? `2026 Resets<br>Version: 2026.0${version}<br>Updated on: ${esc(updated)}`
      : `2026 Resets<br>Draft · becomes version 2026.0${version + 1}`;
  }
  function renderToolbar() {
    const on = role === 'Creator'; $('toolbar').hidden = !on; if (!on) return;
    $('viewSwitch').setAttribute('aria-checked', published);
    $('lblDraft').className = published ? '' : 'on'; $('lblPub').className = published ? 'on' : '';
    $('publishBtn').setAttribute('aria-disabled', !pendingList().length || published);
  }
  function renderBanner() {
    const el = $('banner'), on = role === 'Creator' && !asPublished(); el.hidden = !on; if (!on) return;
    const p = pendingList(), n = c => p.filter(e => e.pending === c).length;
    if (!p.length) { el.textContent = '✔ No unpublished changes in 2026 schedule.'; return; }
    const parts = [['added', 'Added'], ['modified', 'Modified'], ['removed', 'Removed']].filter(([, k]) => n(k)).map(([l, k]) => `${n(k)} ${l}`);
    el.innerHTML = `⚠ ${p.length} unpublished ${p.length === 1 ? 'change' : 'changes'} in 2026 schedule.<span class="bd">${parts.join(' · ')}</span>`;
  }
  function renderGridbar() {
    const el = $('gridbar'), on = asPublished(); el.hidden = !on; if (!on) return;
    const hid = hiddenRemoved().length, rev = revealed(), n = shownRows().length, can = canReveal() && hid > 0;
    el.className = 'gridbar';
    const sum = `Showing ${n} ${n === 1 ? 'reset' : 'resets'}`;
    if (reveal === 'notice' && can) {
      el.className = 'gridbar notice';
      el.innerHTML = `${ICON.info}<span>${rev ? `${sum}, including ${hid} removed.` : `${sum}. ${hid} removed ${hid === 1 ? 'reset is' : 'resets are'} hidden.`}</span>` +
        `<button class="link" data-act="toggle">${rev ? 'Hide removed' : 'Show removed'}</button>`;
    } else if (reveal === 'switch' && can) {
      el.innerHTML = `<span>${sum}</span><label class="chk"><input type="checkbox" id="revealChk" ${rev ? 'checked' : ''}> Show removed resets (${hid})</label>`;
    } else if (reveal === 'panel' && can) {
      el.innerHTML = `<span>${sum}${rev ? '' : ` · ${hid} removed hidden`}</span>` +
        (rev ? `<span class="tag">Removed resets shown<button data-act="toggle" aria-label="Hide removed resets">✕</button></span>` : '');
    } else el.innerHTML = `<span>${sum}</span>`;
  }
  function renderPanel() {
    const usesPanel = reveal === 'panel';
    $('rail').hidden = !usesPanel; $('panel').hidden = !(usesPanel && panelOpen);
    if (!usesPanel) return;
    const draft = !asPublished(), can = canReveal();
    $('panelChk').checked = draft ? true : panelDraft; $('panelChk').disabled = draft || !can;
    $('panelHelp').textContent = draft ? 'Removed resets are always shown in Draft View, so creators can review or restore them before publishing.'
      : can ? 'Removed resets are hidden from the Published Calendar by default.' : 'Removed resets are not available in this view.';
  }
  function render() {
    $('main').classList.toggle('gray', gray);
    renderMeta(); renderToolbar(); renderBanner(); renderGridbar(); renderTable(); renderPanel(); renderProto();
  }

  /* ---------- Actions ---------- */
  document.addEventListener('click', e => {
    if (e.target.closest('[data-stub]')) { toast('Not part of this prototype'); return; }
    const t = e.target.closest('[data-remove],[data-restore],[data-edit],[data-hist],[data-act]');
    if (!t) return;
    if (t.dataset.act === 'toggle') { showRemoved = !showRemoved; panelDraft = showRemoved; render(); return; }
    if (t.dataset.edit) { if (t.getAttribute('aria-disabled') === 'true') return; toast('Edit is not part of this prototype'); return; }
    if (t.dataset.hist) { openHistory(+t.dataset.hist, t); return; }
    const en = entries.find(x => x.id === +(t.dataset.remove || t.dataset.restore)); if (!en) return;
    if (t.dataset.remove) {
      if (en.pending === 'Added') { en.inDraft = false; toast('Discarded the new entry'); }
      else { en.prevPending = en.pending; en.pending = 'Removed'; en.modBy = 'John Doe';
        en.events.unshift({ t: 'Removed', pending: true, by: 'John Doe', when: nowStr(), note: '' });
        toast('Marked for removal. It stays in the draft until you publish.'); }
    } else { en.pending = en.prevPending || null; if (en.events[0]?.pending) en.events.shift(); toast('Restored. It will stay in the schedule.'); }
    render();
  });
  $('gridbar').addEventListener('change', e => { if (e.target.id === 'revealChk') { showRemoved = e.target.checked; panelDraft = showRemoved; render(); } });
  $('viewSwitch').addEventListener('click', () => { published = !published; resetReveal(); render(); });
  $('publishBtn').addEventListener('click', () => {
    const p = pendingList(); if (!p.length || published) return;
    p.forEach(e => {
      if (e.pending === 'Added') { e.live = true; e.pub = 'Added'; }
      else if (e.pending === 'Modified') { e.live = true; e.pub = 'Modified'; }
      else { e.live = false; e.inDraft = false; e.pub = 'Removed'; if (e.events[0]?.pending) { delete e.events[0].pending; e.events[0].version = `2026.0${version + 1}`; } }
      e.pending = null;
    });
    version++; updated = nowStr(); render(); toast(`Published ${p.length} ${p.length === 1 ? 'change' : 'changes'} as version 2026.0${version}.`);
  });

  /* ---------- Filter panel ---------- */
  $('rail').addEventListener('click', () => { panelOpen = true; panelDraft = showRemoved; render(); $('panelClose').focus(); });
  const closePanel = () => { panelOpen = false; render(); $('rail').focus(); };
  $('panelClose').addEventListener('click', closePanel);
  $('panelChk').addEventListener('change', e => { panelDraft = e.target.checked; });
  $('panelApply').addEventListener('click', () => { if (asPublished() && canReveal()) showRemoved = panelDraft; closePanel(); });
  $('panelClear').addEventListener('click', () => { panelDraft = false; showRemoved = false; $('panelChk').checked = false; render(); });

  /* ---------- History dialog ---------- */
  let opener = null;
  function openHistory(id, from) {
    const e = entries.find(x => x.id === id); opener = from;
    $('dlgTitle').textContent = `History · ${e.comm}`;
    $('dlgBody').innerHTML = e.events.map(v => `<li><div class="ev">${v.t === 'Removed' ? pill('Removed') : pill('Added')}${
      v.pending ? '<span style="font-weight:400;color:#5b6573">Not published yet</span>' : v.version ? `<span style="font-weight:400;color:#5b6573">Published in version ${esc(v.version)}</span>` : ''}</div>
      <div class="evm">${esc(v.by)} · ${esc(v.when)}</div>${v.note ? `<div class="evn">${esc(v.note)}</div>` : ''}</li>`).join('');
    $('scrim').hidden = false; $('dlgClose').focus();
  }
  const closeHistory = () => { $('scrim').hidden = true; opener?.isConnected ? opener.focus() : null; opener = null; };
  $('dlgClose').addEventListener('click', closeHistory);
  $('scrim').addEventListener('mousedown', e => { if (e.target === $('scrim')) closeHistory(); });
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (!$('scrim').hidden) closeHistory(); else if (!$('panel').hidden) closePanel();
  });

  /* ---------- Prototype controls ---------- */
  const SEGS = [
    { label: 'View as', opts: [['Viewer', 'Viewer'], ['Creator', 'Creator']], get: () => role, set: v => { role = v; published = false; resetReveal(); } },
    { label: 'Removed rows', opts: [['inplace', 'In place'], ['grouped', 'Grouped at bottom']], get: () => treat, set: v => { treat = v; } },
    { label: 'Reveal in Published', opts: [['switch', 'Checkbox'], ['notice', 'Notice line'], ['panel', 'Filter panel']], get: () => reveal, set: v => { reveal = v; resetReveal(); } },
    { label: 'Viewers can reveal', opts: [['yes', 'Yes'], ['no', 'No']], get: () => viewerReveal ? 'yes' : 'no', set: v => { viewerReveal = v === 'yes'; resetReveal(); } },
    { label: 'Check without color', opts: [['off', 'Off'], ['on', 'Grayscale']], get: () => gray ? 'on' : 'off', set: v => { gray = v === 'on'; } },
  ];
  const ABOUT = {
    switch: '<b>Checkbox.</b> A “Show removed resets (2)” checkbox sits above the grid in Published view. Off by default, and the count says what is hidden.',
    notice: '<b>Notice line.</b> A slim line states what is hidden and offers “Show removed”. It turns into “Hide removed” once on, so the state is always spelled out.',
    panel: '<b>Filter panel.</b> “Include removed resets” lives in the filter panel (rail icon at the left edge) and applies with Apply. A removable tag shows when it is on.',
  };
  function renderProto() {
    $('proto').innerHTML = '<div class="prow"><span class="ptag">Prototype controls</span><button class="linkbtn" id="resetAll">Reset demo data</button><span style="color:#6b7280;font-size:13px">(temporary — no login yet)</span></div>' +
      '<div class="prow">' + SEGS.map((s, i) => `<span class="pgroup"><span class="plabel">${s.label}</span><span class="seg" role="group" aria-label="${s.label}">${
        s.opts.map(([v, l]) => `<button type="button" data-seg="${i}" data-v="${v}" aria-pressed="${s.get() === v}">${l}</button>`).join('')}</span></span>`).join('') + '</div>';
    $('about').innerHTML = `<b>Model.</b> Draft = what we are proposing to change (removed shown). Published = what is currently scheduled (removed hidden unless revealed). History = what changed. &nbsp; ${ABOUT[reveal]}`;
  }
  $('proto').addEventListener('click', e => {
    if (e.target.id === 'resetAll') { entries = seed(); version = 2; updated = '10/9/2026 3:28PM'; resetReveal(); render(); return; }
    const b = e.target.closest('[data-seg]'); if (!b) return;
    SEGS[+b.dataset.seg].set(b.dataset.v); render();
  });

  render();
})();
</script>
</body>
</html>
