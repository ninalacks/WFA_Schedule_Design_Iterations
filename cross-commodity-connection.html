<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Period Overview</title>
<style>
  :root {
    --navy: #0f1f3d; --blue: #1f4e9c; --text: #1c2430; --muted: #5b6573; --border: #d5d9df; --focus: #2563eb; --bg: #f3f4f6;
    --over: #b45309; --over-bg: #fde7c8;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px;
         height: 100vh; height: 100dvh; display: flex; flex-direction: column; }
  button { font: inherit; color: inherit; }
  button:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  .topbar { flex: none; background: var(--navy); height: 64px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 24px; }
  .topbar .brand { justify-self: start; }
  .topright { justify-self: end; display: flex; align-items: center; gap: 20px; }
  .who { display: inline-flex; align-items: center; gap: 8px; color: #fff; font-size: 13px; font-weight: 600; white-space: nowrap; }
  .avatar { width: 26px; height: 26px; border-radius: 50%; background: rgba(255,255,255,.18); display: grid; place-items: center; font-size: 11px; font-weight: 700; letter-spacing: .02em; }
  .brand { color: #fff; font-weight: 700; font-size: 17px; border: 1px solid #fff8; border-radius: 4px; padding: 8px 14px; }
  .vgroup { display: flex; align-items: center; gap: 14px; }
  .vsw { display: inline-flex; align-items: center; gap: 4px; background: rgba(255,255,255,.1); border-radius: 999px; padding: 4px; }
  .vlabel { color: #b9c6e0; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 0 8px 0 10px; }
  .vopt { border: 0; background: transparent; color: #fff; font: inherit; font-size: 13px; font-weight: 600; padding: 7px 14px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
  .vopt:hover { background: rgba(255,255,255,.14); }
  .vopt[aria-pressed="true"] { background: #fff; color: var(--navy); }
  .vopt:focus-visible { outline: 2px solid #8fb4ff; outline-offset: 2px; }
  @media (max-width: 1150px) { .who #whoName { display: none; } .vlabel { display: none; } .vopt { padding: 7px 10px; font-size: 12px; } }
  .topbar a { color: #8fb4ff; font-weight: 700; font-size: 17px; text-decoration: underline; text-underline-offset: 6px; }
  .app { padding: 18px 16px 12px; margin: 0; flex: 1; min-height: 0; display: flex; flex-direction: column; }
  #main { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .results { flex: 1; min-height: 320px; display: flex; flex-direction: column; }
  .results .gridbar { flex: none; }
  .layout { display: flex; gap: 16px; align-items: stretch; flex: 1; min-height: 0; }
  .tblarea { display: flex; flex-direction: column; min-height: 0; }
  .layout > .tblarea { flex: 1; min-width: 0; }
  @media (max-width: 900px) { body { height: auto; display: block; } .app, #main { display: block; } .results { display: block; } .layout { flex-direction: column; } .layout > .tblarea { width: 100%; } .tablewrap { max-height: 75vh; } .panel { min-height: 68px; } }


  .titlerow { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; margin-bottom: 14.7px; flex: none; }
  h1 { font-size: 26px; margin: 0; }
  .meta { font-size: 14px; color: #333; line-height: 1.35; margin-top: 2px; }

  /* Overview strip */

  /* Scope summary */
  .btn2 { border: 1px solid var(--border); background: #fff; border-radius: 6px; padding: 7px 12px; cursor: pointer; font-size: 13px; font-weight: 600; display: inline-flex; gap: 6px; align-items: center; }
  .btn2[aria-expanded="true"] { background: var(--navy); color: #fff; border-color: var(--navy); }

  .gridbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; min-height: 34px; margin-bottom: 8px; font-size: 14px; color: var(--muted); }
  .tags { display: inline-flex; flex-wrap: wrap; gap: 6px; align-items: center; }

  /* Filter rail + panel (pattern from date-filter-v6) */
  .panel { width: 320px; flex: none; background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.12); position: relative; transition: width .25s ease; }
  .panel:not(.collapsed):not(.animating) { overflow-y: auto; }
  .panel.collapsed { width: 56px; }
  .panel.collapsed, .panel.animating { overflow: hidden; }
  .panel-body { width: 320px; padding: 20px 18px 0; position: relative; transition: opacity .15s ease; }
  .panel.collapsed .panel-body { opacity: 0; pointer-events: none; position: absolute; top: 0; left: 0; height: 0; overflow: hidden; }
  .panel-head { display: flex; align-items: center; justify-content: space-between; margin: 0 0 6px; }
  .panel-head h2 { font-size: 23px; margin: 0; }
  .icon-btn { width: 40px; height: 40px; border: 0; background: transparent; border-radius: 8px; color: var(--blue); cursor: pointer; display: grid; place-items: center; position: relative; }
  .icon-btn:hover { background: #eef2fa; }
  .prail { position: absolute; top: 0; left: 0; width: 56px; padding-top: 14px; display: flex; justify-content: center; opacity: 0; pointer-events: none; transition: opacity .15s ease .1s; }
  .panel.collapsed .prail { opacity: 1; pointer-events: auto; }
  .badge { position: absolute; top: 2px; right: 0; min-width: 18px; height: 18px; border-radius: 9px; background: var(--navy); color: #fff; font-size: 10px; font-weight: 700; display: grid; place-items: center; padding: 0 4px; }
  @media (prefers-reduced-motion: reduce) { .panel, .panel-body, .prail { transition: none; } }
  .flabel { display: block; font-weight: 600; font-size: 13px; color: var(--muted); margin: 16px 0 6px; }
  .field { width: 100%; height: 40px; border: 1px solid var(--border); border-radius: 6px; background: #fff; display: flex; align-items: center; padding: 0 10px; gap: 8px; font-size: 14px; color: var(--text); cursor: pointer; text-align: left; }
  .field.placeholder, .sel select.field.empty { color: #666; }
  .field[aria-expanded="true"], .field:focus-visible { border: 2px solid var(--focus); outline: none; padding: 0 9px; }
  .field .label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .clear-x { border: 0; background: none; font-size: 17px; color: var(--muted); cursor: pointer; padding: 0 4px; }
  .clear-x:hover { color: var(--text); }
  .clear-x:focus-visible { outline: 2px solid var(--focus); border-radius: 4px; }
  .caret { font-size: 10px; color: var(--muted); }
  .sel { position: relative; }
  .sel select.field { padding-right: 62px; appearance: none; -webkit-appearance: none; text-overflow: ellipsis; }
  .sel .caret { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); pointer-events: none; }
  .sel .clear-x { position: absolute; right: 30px; top: 50%; transform: translateY(-50%); }
  .dropdown { position: relative; }
  .popover { position: absolute; top: 44px; left: 0; width: 100%; background: #fff; border: 1px solid var(--border); border-radius: 6px; padding: 12px 10px; box-shadow: 0 6px 20px rgba(0,0,0,.18); z-index: 10; }
  .popover[hidden] { display: none; }
  .pk-head, .pk-row { display: grid; grid-template-columns: 52px repeat(4, 1fr); align-items: center; }
  .pk-head { color: var(--muted); font-size: 13px; margin-bottom: 6px; padding-left: 4px; }
  .pk-scroll { max-height: 280px; overflow-y: auto; }
  .pk-row { height: 44px; position: relative; }
  .pk-plabel { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-size: 14px; margin-left: 4px; }
  .pk-plabel.clickable { cursor: pointer; }
  .pk-plabel.clickable:not(.edge):hover { background: #dbe8fe; }
  .pk-plabel:focus-visible { outline: 2px solid var(--focus); }
  .pk-plabel.edge { background: var(--navy); color: #fff; }
  .pk-week { height: 36px; border: 0; background: transparent; font-size: 14px; color: var(--text); cursor: pointer; display: grid; place-items: center; margin: 4px 0; position: relative; }
  .pk-week.inrange, .pk-week.preview { background: #dbe8fe; }
  .pk-week.edge::before { content: ""; position: absolute; width: 36px; height: 36px; border-radius: 50%; background: var(--navy); z-index: 0; }
  .pk-week.edge span { position: relative; z-index: 1; color: #fff; }
  .pk-week:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
  .pk-div { border-left: 1px solid #e3e6ea; position: absolute; left: 52px; top: 4px; bottom: 4px; }
  .pk-seg { display: grid; grid-template-columns: 1fr 1fr; background: #eceef1; border-radius: 999px; padding: 3px; margin: 0 4px 12px; }
  .pk-seg button { border: 0; background: transparent; height: 30px; border-radius: 999px; font-size: 13px; color: var(--muted); cursor: pointer; }
  .pk-seg button[aria-pressed="true"] { background: #fff; color: var(--text); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
  .pk-seg button:focus-visible { outline: 2px solid var(--focus); }
  .pk-hint { font-size: 12px; color: var(--muted); margin: 10px 4px 0; min-height: 18px; }
  .clear-row { display: flex; justify-content: flex-end; margin: 0; }
  .link-btn { border: 0; background: none; padding: 4px 2px; font-size: 15px; color: var(--blue); text-decoration: underline; cursor: pointer; }
  .link-btn:focus-visible { outline: 2px solid var(--focus); border-radius: 2px; }
  .link-btn:disabled { color: #9aa3b0; cursor: default; }
  .pfoot { position: sticky; bottom: 0; background: #fff; padding: 12px 0 16px; margin-top: 12px; }
  .pbtn { width: 100%; height: 44px; border-radius: 6px; font-size: 16px; border: 1px solid var(--navy); background: var(--navy); color: #fff; font-weight: 600; cursor: pointer; }

  /* Table */
  .tablewrap { background: #fff; border: 1px solid #e3e6ea; overflow: scroll; flex: 1; min-height: 0; }
  .tablewrap::-webkit-scrollbar { width: 14px; height: 14px; }
  .tablewrap::-webkit-scrollbar-track { background: #f1f2f4; }
  .tablewrap::-webkit-scrollbar-thumb { background: #b3bcc9; border-radius: 8px; border: 3px solid #f1f2f4; }
  .tablewrap::-webkit-scrollbar-thumb:hover { background: #8d97a6; }
  .tablewrap::-webkit-scrollbar-corner { background: #f1f2f4; }
  @supports not selector(::-webkit-scrollbar) { .tablewrap { scrollbar-color: #b3bcc9 #f1f2f4; } }
  table { border-collapse: collapse; width: 100%; min-width: 1500px; font-size: 14px; }
  th { background: #f1f2f4; text-align: left; font-weight: 700; padding: 12px 10px; border-bottom: 2px solid #dde0e5; font-size: 14px; white-space: nowrap; }
  td { padding: 12px 10px; border-bottom: 1px solid #eceef1; vertical-align: middle; }
  td { white-space: nowrap; }
  td.com { width: 240px; min-width: 240px; max-width: 240px; }
  td.com .cwrap { display: flex; align-items: baseline; gap: 6px; }
  td.com .ctext { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  td.com .cmore { flex: none; border: 0; background: none; padding: 0 2px; margin: 0; font: inherit; font-size: 13px; color: var(--blue); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; border-radius: 3px; white-space: nowrap; }
  td.com .cmore:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  td.com .cmore[hidden] { display: none; }
  /* expanded: the full comment, wrapped like before */
  td.com.open { min-width: 280px; max-width: 340px; white-space: normal; }
  td.com.open .cwrap { display: block; }
  td.com.open .ctext { overflow: visible; white-space: normal; text-overflow: clip; }
  td.com.open .cmore { margin-left: 4px; }
  th.wk, td.wk { text-align: center; width: 76px; padding-left: 4px; padding-right: 4px; }
  th.wk { border-left: 1px solid #dde0e5; }
  th.wk small { display: block; font-weight: 400; font-size: 10px; color: var(--muted); }
  td.wk { border-left: 1px solid #f1f2f4; }
  td.wk.on { font-weight: 700; }
  td.wk.over { color: var(--over); }
  tfoot td { position: sticky; bottom: 0; z-index: 2; background: #f8f9fb; font-weight: 700; border: 0 !important; box-shadow: inset 0 2px 0 #dde0e5, inset -1px 0 0 #e3e6ea; }
  tfoot td.wk { vertical-align: top; }
  tfoot td.wk.over { color: var(--over); }
  .st { display: inline-block; box-sizing: border-box; width: 84px; padding: 2px 0; border-radius: 999px; font-size: 12px; font-weight: 600; line-height: 15px; text-align: center; white-space: nowrap; }
  .st.Added { background: #d7efdd; color: #17653a; } .st.Modified { background: #e1eafb; color: #1f4e9c; }
  tr.add td { background: #e9f6ec; } td.chg { background: #dbe8fe !important; }
  th.wk.pg { font-size: 12px; padding: 6px 2px; }
  th.wk.w { font-size: 11px; padding: 4px 2px; font-weight: 600; color: var(--muted); }
  th.wk.ps { border-left: 2px solid #cfd5de; }
  td.wk.ps { border-left: 1px solid #cfd5de; } 
  table.cmp th.wk, table.cmp td.wk { width: 34px; min-width: 34px; padding-left: 0; padding-right: 0; font-size: 12px; }
  .stk { position: sticky; z-index: 1; background: #fff; }
  th.stk { background: #f1f2f4; z-index: 3; }
  .stk1 { left: 0; }
  .stk1, .stk2 { border-right: 0 !important; box-shadow: inset -1px 0 0 #dde0e5; }
  .stk2 { left: var(--c1w, 180px); box-shadow: inset -1px 0 0 #dde0e5, 6px 0 6px -6px rgba(15,31,61,.25); }
  th, td { border-right: 1px solid #e3e6ea; }
  thead th { position: sticky; top: 0; z-index: 2; border: 0 !important; box-shadow: inset -1px 0 0 #dde0e5, inset 0 -2px 0 #dde0e5; }
  thead th.wk.ps { box-shadow: inset 2px 0 0 #cfd5de, inset -1px 0 0 #dde0e5, inset 0 -2px 0 #dde0e5; }
  thead th.wk.w { top: var(--h1, 40px); }
  thead th.wk { z-index: 2; }
  thead th.stk1 { box-shadow: inset -1px 0 0 #dde0e5, inset 0 -2px 0 #dde0e5; }
  thead th.stk2 { box-shadow: inset -1px 0 0 #dde0e5, inset 0 -2px 0 #dde0e5, 6px 0 6px -6px rgba(15,31,61,.25); }
  th { border-right-color: #dde0e5; line-height: 1.15; }
  tfoot td.stk { background: #f8f9fb; z-index: 3; }
  tfoot td.wk.ps { box-shadow: inset 0 2px 0 #dde0e5, inset 1px 0 0 #cfd5de, inset -1px 0 0 #e3e6ea; }
  tfoot td.stk1 { box-shadow: inset 0 2px 0 #dde0e5, inset -1px 0 0 #dde0e5; }
  tfoot td.stk2 { box-shadow: inset 0 2px 0 #dde0e5, inset -1px 0 0 #dde0e5, 6px 0 6px -6px rgba(15,31,61,.25); }
  .hwrap { display: inline-flex; align-items: center; gap: 8px; }
  .sorth { border: 0; background: none; font: inherit; font-weight: 700; color: inherit; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; padding: 2px 0; margin: 0; text-align: left; line-height: 1.15; white-space: nowrap; border-radius: 4px; }
  .sorth .sa { display: inline-flex; color: #8a94a3; opacity: 0; transition: opacity .1s; }
  .sorth:hover .sa, .sorth:focus-visible .sa { opacity: 1; }
  .sorth.on .sa { opacity: 1; color: var(--navy); }
  .sorth:hover { color: var(--blue); }
  th[aria-sort] { background: #e6eaf1; }
  @media (prefers-reduced-motion: reduce) { .sorth .sa { transition: none; } }
  .xbtn { width: 26px; height: 26px; border: 1px solid #b9c2d0; background: #fff; border-radius: 6px; cursor: pointer; display: inline-grid; place-items: center; color: var(--blue); padding: 0; }
  .xbtn:hover { background: #eef2fa; }
  .xbtn[aria-expanded="true"] { background: var(--navy); color: #fff; border-color: var(--navy); }
  .switch { width: 38px; height: 22px; border-radius: 999px; background: #c3c9d2; border: 0; position: relative; cursor: pointer; padding: 0; }
  .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: left .15s; }
  .switch[aria-checked="true"] { background: var(--navy); }
  .switch[aria-checked="true"]::after { left: 18px; }
  @media (prefers-reduced-motion: reduce) { .switch::after { transition: none; } }
  .emp { text-align: center; color: var(--muted); padding: 32px; }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #1c2430; color: #fff; padding: 10px 18px; border-radius: 8px; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 80; max-width: 90vw; }
  .toast.show { opacity: 1; }

  /* Division list modal */
  .divbtn { border: 0; background: none; font: inherit; color: var(--blue); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 2px 6px; margin: -2px -6px; border-radius: 4px; }
  .divbtn:hover { background: #e8eef9; }
  .divbtn:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  #dDlg { width: min(460px, 100%); }
  .dsub { padding: 14px 22px 10px; color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
  .dhead, .dpl li { display: grid; grid-template-columns: 96px 1fr; gap: 12px; padding: 8px 22px; font-size: 14px; }
  .dhead { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; border-bottom: 1px solid #e3e6ea; padding-top: 10px; padding-bottom: 8px; }
  .dpl { list-style: none; margin: 0; padding: 0 0 6px; max-height: 50vh; overflow: auto; }
  .dpl li + li { border-top: 1px solid #f1f2f4; }
  .dpl .dn { color: var(--muted); font-variant-numeric: tabular-nums; }

  /* Global toasts: top right, stacked, below the top bar */
  .toasts { position: fixed; top: 76px; right: 16px; z-index: 90; width: min(380px, calc(100vw - 32px)); display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
  .gtoast { pointer-events: auto; display: grid; grid-template-columns: 22px 1fr 22px; column-gap: 12px; row-gap: 4px; align-items: start; padding: 14px 14px 14px 16px; border-radius: 6px; color: #000; box-shadow: 0 6px 20px rgba(15,31,61,.18); animation: gtIn .18s ease-out; }
  .gtoast.success { background: #c3f1d6; --tc: #17653a; }
  .gtoast.info { background: #d2eafa; --tc: #1e5ca7; }
  .gtoast.error { background: #fcdbdb; --tc: #a9001f; }
  .gtoast.warn { background: #fff4cc; box-shadow: inset 0 0 0 1px #f1dc8f, 0 6px 20px rgba(15,31,61,.18); --tc: #983301; }
  .gtoast .gti { grid-column: 1; grid-row: 1; display: flex; padding-top: 1px; }
  .gtoast .gtt { grid-column: 2; grid-row: 1; font-weight: 700; font-size: 15px; line-height: 22px; }
  .gtoast .gtx { grid-column: 3; grid-row: 1; border: 0; background: none; color: var(--tc); width: 22px; height: 22px; border-radius: 4px; cursor: pointer; font-size: 15px; line-height: 1; padding: 0; }
  .gtoast .gtx:hover { background: rgba(0,0,0,.08); }
  .gtoast .gtb { grid-column: 2 / 4; grid-row: 2; font-size: 14px; line-height: 1.4; }
  .gtoast .gtl { grid-column: 2 / 4; grid-row: 3; margin-top: 4px; }
  .gtoast .tlink { border: 0; background: none; padding: 0; font: inherit; font-size: 14px; font-weight: 700; color: var(--tc); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; border-radius: 2px; }
  .gtoast :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  @keyframes gtIn { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .gtoast { animation: none; } }

  /* Creator */
  .titlerow, .toolbar, .banner { flex: none; }
  .tools { display: flex; gap: 8px; }
  .sq { width: 36px; height: 36px; border: 1px solid var(--border); background: #fff; border-radius: 4px; display: grid; place-items: center; cursor: pointer; color: var(--text); padding: 0; }
  .sq:hover:not(:disabled) { background: #eef2fa; }
  .sq:disabled { color: #c3c8d0; cursor: not-allowed; background: #f4f5f7; }
  .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin: 0 0 12px; }
  .tbtns { display: flex; gap: 10px; flex-wrap: wrap; }
  .tb { height: 38px; padding: 0 14px; border: 1px solid var(--border); background: #fff; border-radius: 4px; font-size: 15px; cursor: pointer; }
  .tb:hover:not(:disabled) { background: #f4f6fa; }
  .tb:disabled { cursor: not-allowed; }
  .tb.pub { background: var(--navy); border-color: var(--navy); color: #fff; }
  .tb.pub:hover:not(:disabled) { background: #1b3560; }
  .tb.pub:disabled { background: #707c8d; border-color: #707c8d; opacity: .8; }
  .viewsw { display: flex; align-items: center; gap: 8px; font-size: 15px; color: var(--muted); }
  .viewsw .on { color: var(--text); font-weight: 700; }
  .banner { color: #000; border-radius: 6px; padding: 10px 14px; font-size: 15px; margin: 0 0 12px; display: flex; align-items: center; gap: 12px; }
  .banner.info { background: #d2eafa; }
  .banner.success { background: #c3f1d6; }
  .banner.error { background: #fcdbdb; }
  .banner.warn { background: #fff4cc; box-shadow: inset 0 0 0 1px #f1dc8f; }
  .banner > svg { flex: none; }
  th.actc, td.act { width: 60px; min-width: 60px; text-align: center; padding-left: 4px; padding-right: 4px; }
  td.act input[type="checkbox"], th.actc input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--navy); cursor: pointer; vertical-align: middle; }
  td.act input[type="checkbox"]:disabled, th.actc input[type="checkbox"]:disabled { cursor: not-allowed; opacity: .4; }

  /* ---------- Cross-commodity sets: no letters, no parent/child, nothing in the other columns. The Set column alone carries the signal. ---------- */
  /* Cross-commodity set: a line on the left edge of the first column, no extra column. */
  tbody td:first-child { position: relative; }
  .xsr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .xw { position: absolute; left: 0; top: 0; bottom: 0; width: 16px; z-index: 1; --xh: #0F52A2; }
  .xw:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
  .xw i { position: absolute; display: block; background: var(--xh); left: 0; }
  .xw i.l { width: 3px; }
  .xw i.k { width: 10px; height: 3px; display: none; }
  /* Line runs the full height of the set, top edge of the first row to bottom edge of the last; ticks only at those two edges.

  .xw i.l { top: 0; bottom: 0; }
  .xw i.k.a { top: 0; } .xw i.k.e { bottom: 0; }
  .xw.t i.k.a, .xw.s i.k.a, .xw.b i.k.e, .xw.s i.k.e { display: block; }
  .xw.t i.l, .xw.t i.k.a, .xw.s i.l, .xw.s i.k.a { top: 2px; } .xw.b i.l, .xw.b i.k.e, .xw.s i.l, .xw.s i.k.e { bottom: 2px; }

  .xtip { position: fixed; z-index: 60; background: #1c2430; color: #fff; font-size: 13px; font-weight: 500; line-height: 1.3; padding: 6px 10px; border-radius: 6px; white-space: nowrap; pointer-events: none; box-shadow: 0 2px 8px rgba(15,31,61,.25); }

  /* Hover or focus any member and every member of its set lights up, wherever they sit (also covers sets split apart by a sort). */
  body.xhl tr.xhl td:not(.chg) { background-color: #e6ebf5 !important; }
  @media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
